# Publishes the checker to GitHub Pages on every push to main.
# Only website/ and core/ are staged, so the extension, tooling and notes in the
# repo are never published. The page that gets deployed is
#   https://<owner>.github.io/verisafe/website/
name: Deploy website to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage the static files
        run: |
          mkdir -p _site
          cp -r website _site/website
          cp -r core _site/core
          printf '%s\n' \
            '<!DOCTYPE html>' \
            '<meta charset="utf-8">' \
            '<meta http-equiv="refresh" content="0; url=./website/">' \
            '<title>Verisafe</title>' \
            '<p><a href="./website/">Open the Verisafe checker</a></p>' \
            > _site/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
